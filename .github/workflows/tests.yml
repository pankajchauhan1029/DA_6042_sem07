name: project-tests

on:
  push:
    branches: [main, feat/freqnet-fcr]
  pull_request:
    branches: [main]

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch torchvision numpy scikit-learn scipy opencv-python pillow tensorboard pytest
      - name: Compile project modules
        run: python -m compileall -q .
      - name: Run unit tests
        run: pytest -q
